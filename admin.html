<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUNS 관리자</title>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:920px;margin:36px auto;padding:0 18px}.card{background:#141b2d;border:1px solid #293149;border-radius:16px;padding:18px;margin-bottom:16px}input,button{font:inherit;border-radius:9px;padding:10px 12px;border:1px solid #34405b}input{background:#0f1627;color:#fff}button{cursor:pointer}.primary{background:#7dd3fc;color:#07111a;font-weight:800}.danger{background:#7f1d1d;color:#fff}.ok{background:#166534;color:#fff}.muted{color:#9ca3af;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.user{display:grid;grid-template-columns:1fr 120px 170px;gap:10px;align-items:center;border-top:1px solid #293149;padding:12px 0}.badge{font-size:12px}.msg{margin-top:10px;color:#fca5a5}@media(max-width:700px){.user{grid-template-columns:1fr}.row button{flex:1}}
</style></head><body><div class="wrap"><h1>HUNS 회원 관리자</h1><div class="muted">승인 대기 회원을 승인/거절하고 기존 회원 승인을 취소할 수 있습니다.</div>
<div id="login" class="card"><h3>관리자 로그인</h3><div class="row"><input id="u" placeholder="관리자 아이디"><input id="p" type="password" placeholder="비밀번호"><button id="go" class="primary">로그인</button></div><div id="m" class="msg"></div></div>
<div id="panel" hidden><div class="card"><div class="row"><button id="refresh">새로고침</button><button id="logout">로그아웃</button><span id="who" class="muted"></span></div></div><div class="card"><h3>회원 목록</h3><div id="users"></div></div></div></div>
<script src="auth-config.js"></script><script src="admin.js"></script></body></html>
