<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>ALPHA BOARD · Public Market Monitor</title>
<style>
:root{--bg:#071015;--panel:#0b151b;--line:#18303a;--text:#d8e7ec;--muted:#78909a;--green:#30e69a;--red:#ff6278;--amber:#ffc857;--blue:#58b8ff;--cyan:#57e6dd}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;background:rgba(7,16,21,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 16px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em}.brand b{color:var(--green)}
.sub{color:var(--muted);font-size:11px}.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);box-shadow:0 0 10px var(--green)}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}input,button{background:#0a171d;border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:6px;font:inherit}button.active{border-color:var(--green);color:var(--green)}
main{padding:0 12px 24px}.wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:12px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:1240px}th,td{padding:10px 9px;border-bottom:1px solid #13262e;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#09141a;color:#6f8a95;font-size:10px;letter-spacing:.08em;text-transform:uppercase;z-index:2}th:nth-child(2),td:nth-child(2){text-align:left}.rank{color:#6f8994}.sym{font-weight:800;font-size:14px}.tag{font-size:9px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:#829aa4;margin-left:5px}.q{font-weight:900}.q.strong{color:var(--green)}.q.good{color:#7fdcff}.q.neutral{color:var(--amber)}.q.watch{color:#9aaeb6}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}.vabove{color:var(--green)}.vbelow{color:var(--red)}
footer{color:#607780;text-align:center;padding:14px;font-size:10px}.stale{color:var(--red)}
@media(max-width:700px){header{padding:10px}main{padding:0 6px}.sub{display:none}th,td{padding:8px 7px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><div class="brand">ALPHA <b>BOARD</b> · PUBLIC</div><div class="sub">시장 현황판 · 공개용 QUALITY · 매매 시그널/진입판정 아님</div></div>
    <div class="status"><span><span class="dot" id="dot"></span> <span id="fresh">loading</span></span><span id="updated" class="muted">—</span><span id="count" class="muted">—</span></div>
  </div>
  <div class="controls">
    <input id="search" placeholder="Symbol 검색" autocomplete="off" />
    <button data-filter="ALL" class="active">ALL</button><button data-filter="CRYPTO">CRYPTO</button><button data-filter="TRADFI">TRADFI</button>
    <button id="refresh">새로고침</button>
  </div>
</header>
<main><div class="wrap"><table>
<thead><tr><th>#</th><th>SYMBOL</th><th>QUALITY</th><th>PRICE</th><th>24H</th><th>OI 4H</th><th>CVD</th><th>FUNDING</th><th>TURNOVER</th><th>VOL</th><th>VWAP</th><th>ATR</th><th>RANGE POS</th></tr></thead>
<tbody id="body"><tr><td colspan="13" class="muted" style="text-align:center">데이터 대기 중…</td></tr></tbody>
</table></div></main>
<footer>Public market monitor only · No Entry / TP / SL / Monster / Huns / private Alpha data is published.</footer>
<script>
let DATA=null, FILTER='ALL';
const $=s=>document.querySelector(s), fmt=(v,d=2)=>v==null?'N/A':Number(v).toLocaleString(undefined,{maximumFractionDigits:d}), sign=(v,d=2)=>v==null?'N/A':`${v>0?'+':''}${Number(v).toFixed(d)}%`;
function money(v){if(v==null)return'N/A'; v=Number(v); if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B'; if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M'; if(v>=1e3)return'$'+(v/1e3).toFixed(0)+'K'; return'$'+v.toFixed(0)}
function cls(v){return v==null?'muted':v>0?'pos':v<0?'neg':'muted'}
function qcls(g){return (g||'watch').toLowerCase()}
function render(){if(!DATA)return; const q=$('#search').value.trim().toUpperCase(); let rows=(DATA.rows||[]).filter(r=>(FILTER==='ALL'||r.market===FILTER)&&(!q||r.symbol.includes(q)));
$('#body').innerHTML=rows.length?rows.map(r=>`<tr><td class="rank">${r.rank}</td><td><span class="sym">${r.symbol}</span><span class="tag">${r.market}</span></td><td class="q ${qcls(r.grade)}">${r.quality} <span class="tag">${r.grade}</span></td><td>${fmt(r.price,8)}</td><td class="${cls(r.p24)}">${sign(r.p24)}</td><td class="${cls(r.oi4)}">${sign(r.oi4)}</td><td class="${r.cvd==null?'muted':r.cvd>=60?'pos':r.cvd<45?'neg':''}">${r.cvd==null?'N/A':fmt(r.cvd,1)+'%'}</td><td class="${r.funding==null?'muted':Math.abs(r.funding)>=.06?'neg':''}">${r.funding==null?'N/A':sign(r.funding,4)}</td><td>${money(r.turnover)}</td><td>${r.surge==null?'N/A':'×'+fmt(r.surge,2)}</td><td class="${r.vwap==='ABOVE'?'vabove':'vbelow'}">${r.vwap||'N/A'}</td><td>${r.atr==null?'N/A':fmt(r.atr,2)+'%'}</td><td>${r.range_pos==null?'N/A':fmt(r.range_pos,1)+'%'}</td></tr>`).join(''):`<tr><td colspan="13" class="muted" style="text-align:center">조건에 맞는 종목 없음</td></tr>`;
}
async function load(){try{const r=await fetch('./alpha_public.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw Error('HTTP '+r.status); DATA=await r.json(); const age=Math.max(0,Math.floor(Date.now()/1000-(DATA.updated_ts||0))); $('#updated').textContent='updated '+(DATA.updated||'—'); $('#count').textContent=(DATA.count||0)+' symbols'; const stale=age>Math.max(600,(DATA.scan_sec||180)*3); $('#fresh').textContent=stale?'STALE '+Math.floor(age/60)+'m':'LIVE'; $('#fresh').className=stale?'stale':''; $('#dot').style.background=stale?'var(--red)':'var(--green)'; render();}catch(e){$('#fresh').textContent='DATA ERROR';$('#fresh').className='stale';$('#dot').style.background='var(--red)';}}
$('#search').addEventListener('input',render); document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}); $('#refresh').onclick=load;
load(); setInterval(load,30000);
</script>
</body></html>
